<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Accueil</title>
</head>
<body>

    <div class="logo">🐧</div>
    <div class="titre">
        <span>L</span>
        <span>i</span>
        <span>n</span>
        <span>u</span>
        <span>x</span>
        <span>F</span>
        <span>a</span>
        <span>c</span>
        <span>i</span>
        <span>l</span>
        <span>e</span>
    </div>
    <div class="second-titre">COMMANDES LINUX</div>
    <div class="cadre-titre"></div>
    <div class="commandes">
        <div class="cd">
            <h1>cd</h1>
            <p>Aller dans un dossier.</p>
        </div>
        <div class="ls">
            <h1>ls</h1>
            <p>Voire tous les éléments du 
                dossier dans lequel on se trouve.</p>
        </div>
        <div class="mkdir">
            <h1>mkdir</h1>
            <p>Créer un dossier.</p>
        </div>
        <div class="touch-fichier-txt">
            <h1>touch</h1>
            <p>Créer un fichier.</p>
        </div>
        <div class="cddeuxpoints">
            <h1>cd ..</h1>
            <p>Revenir dans le dossier précédent.</p>
        </div>
        <div class="sudo">
            <h1>sudo apt update</h1>
            <p>Mettre à jour son terminal.</p>
        </div>
    </div>
    
</body>
</html>
